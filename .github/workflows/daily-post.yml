name: Article tous les 2 jours

on:
  schedule:
    # 8h à Paris : 07:00 UTC en hiver, 06:00 UTC en été.
    # Les deux crons tournent chaque jour, mais le script ne publie qu'à partir de 8h
    # (heure de Paris) et seulement si le dernier article date d'au moins 2 jours.
    # Les jours sans publication, le run s'arrête en quelques secondes sans appeler l'API.
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer l'article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optionnel : définir BLOG_MODEL / BLOG_EFFORT dans Settings > Variables
          BLOG_MODEL: ${{ vars.BLOG_MODEL || 'claude-opus-5-5' }}
          BLOG_EFFORT: ${{ vars.BLOG_EFFORT || 'medium' }}
          BLOG_INTERVAL_DAYS: ${{ vars.BLOG_INTERVAL_DAYS || '2' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/generate_post.py --not-before 8
          else
            python scripts/generate_post.py
          fi

      - name: Commit et push
        run: |
          if [ -z "$(git status --porcelain _posts scripts/topics.json)" ]; then
            echo "Aucun nouvel article à publier."
            exit 0
          fi
          git config user.name "blog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts scripts/topics.json
          git commit -m "Article du $(TZ=Europe/Paris date +%Y-%m-%d)"
          git push
